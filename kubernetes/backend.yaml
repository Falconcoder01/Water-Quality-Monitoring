apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: water
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: falconcoder01/monitoring-app-backend:latest
          ports:
            - containerPort: 8081
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/wqm
            - name: DB_USERNAME
              value: example_user
            - name: DB_PASSWORD
              value: password123

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: water
spec: 
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      nodePort: 31100
    
